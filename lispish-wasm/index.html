<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lispish REPL</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: monospace;
        font-size: 16px;
      }
      pre {
        margin: 0;
      }
      .row {
        display: flex;
      }
      input {
        flex: 1;
        border: none;
        outline: none;
        font: inherit;
        background: transparent;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <p>
      Lispish REPL (<a href="https://github.com/ggliv/lispish">source code</a>)
      <button id="clear" type="button">Clear persistent REPL state and reload</button>
    </p>
    <pre id="out"></pre>
    <div class="row">
      <span id="prompt">lispish&gt; </span>
      <input
        id="in"
        type="text"
        autocomplete="false"
        autocapitalize="false"
        spellcheck="false"
        autofocus
      />
    </div>

    <script type="module">
      import init, { Lispish } from "./pkg/lispish_wasm.js";

      const HEAP_STATE_KEY = "heapState";

      const clear = document.getElementById("clear");
      const out = document.getElementById("out");
      const prompt = document.getElementById("prompt");
      const input = document.getElementById("in");

      document.addEventListener("click", (e) => {
        if (e.target.closest("a[href]")) {
          return;
        }

        if (window.getSelection().toString().length === 0) {
          input.focus();
        }
      });

      window.lispishPrint = (text) => {
        out.textContent += text;
      };

      await init();
      const repl = Lispish.try_from_json(localStorage.getItem(HEAP_STATE_KEY));

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const line = input.value;
          input.value = "";

          out.textContent += prompt.textContent + line + "\n";

          const ret = repl.eval_line(line);

          localStorage.setItem(HEAP_STATE_KEY, repl.to_json());

          out.textContent += ret;

          prompt.textContent = repl.prompt();
        }
      });


      clear.addEventListener("click", () => {
        localStorage.removeItem(HEAP_STATE_KEY);
        window.location.reload();
      });

    </script>
  </body>
</html>
